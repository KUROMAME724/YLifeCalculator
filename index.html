    <title>ラッシュデュエル ライフ電卓</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
      :root{
        /* Master Duel / Blue-Eyes skin: deep duel-field navy, glowing cyan
           lines, silver plate buttons. Variable names kept from the
           previous skin so every rule that referenced them (LP glow,
           chips, status, toast…) re-themes too. No emblem / triangle
           motif — colour and frame language only. */
        --bg:#040918;
        --bg-panel:#0a142e;
        --bg-panel2:#0d1a3a;
        --line:#2b4a7d;
        --line-soft:#1b2c52;
        --line-bright:#57c8ff;
        --ink:#e8f2ff;
        --ink-dim:#9db4d4;
        --ink-faint:#5f7699;
        --cyan:#38cfff;
        --cyan-deep:#1e7fff;
        --cyan-hi:#aeeaff;
        --ice:#eaf6ff;
        --silver-hi:#f4f9ff;
        --silver:#c9d9ee;
        --silver-lo:#8ea9c9;
        --rose:#ff5b74;
        --red:#ff3b57;
        --red-deep:#a3132b;
        --green:#2fe6c8;
        --green-deep:#0d7a6e;
        --amber:#ffd968;
        --gold-hi:#aeeaff;
        --p1:var(--cyan);
        --p2:var(--rose);
        --radius:10px;
      }
      *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      /* Rapid tapping must never select text or bring up the copy /
         magnifier callout (iOS long-press & double-tap selection):
         the whole UI is buttons and readouts, nothing here is meant
         to be selected. Kept off inputs below so the room-code and
         invite-link fields still behave like normal text fields. */
      html,body,button,.calc,.pcard,.modebar,.rpanel,.status,.hrow,.amt,.lp,.roomcode{
        -webkit-user-select:none; user-select:none;
        -webkit-touch-callout:none;
      }
      input,textarea{ -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }
      html,body{ margin:0; padding:0; overscroll-behavior:none; overscroll-behavior-y:none; }
      /* the root gets the same base colour as the body so any area the
         browser paints outside the body (status-bar / safe areas in
         standalone mode) is the duel-field base, never a black strip */
      html{ overscroll-behavior:none; background:var(--bg); }
      body{
        /* Master Duel field: deep navy, a faint hex-grid weave, cyan
           light falling from the top of the field and a deep blue wash
           at the lower corner. All static gradients — no animation
           cost, same battery profile. */
        background:
          radial-gradient(820px 420px at 50% -12%, rgba(56,160,255,.20), transparent 62%),
          radial-gradient(700px 500px at 110% 108%, rgba(30,80,200,.14), transparent 60%),
          repeating-linear-gradient(60deg, rgba(87,200,255,.035) 0 1px, transparent 1px 34px),
          repeating-linear-gradient(-60deg, rgba(87,200,255,.035) 0 1px, transparent 1px 34px),
          linear-gradient(180deg,#060f2a 0%, #040918 55%, #02040c 100%);
        color:var(--ink);
        font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
        -webkit-font-smoothing:antialiased;
        height:100dvh;
        overflow:hidden;
        overscroll-behavior:none;
        touch-action:manipulation;
      }
      html{ height:100%; }
      button{ font-family:inherit; touch-action:manipulation; cursor:pointer; }
      .num{ font-family:"Rajdhani","Zen Kaku Gothic New",sans-serif; font-variant-numeric:tabular-nums; letter-spacing:.02em; }

      /* safe-area insets: with the translucent status bar the page extends
         under the clock / notch in standalone mode, so the content pads
         itself clear of it (insets are 0 in a normal browser tab, so the
         layout there is unchanged) */
      #app{ max-width:600px; margin:0 auto; padding:calc(4px + env(safe-area-inset-top, 0px)) calc(6px + env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) calc(6px + env(safe-area-inset-left, 0px)); height:100dvh; display:flex; flex-direction:column; justify-content:center; justify-content:safe center; }
      #view-solo,#view-remote{ flex:0 1 auto; min-height:0; display:flex; flex-direction:column; }
      /* the calculator panel hugs its content instead of stretching to
         fill the screen: leftover height used to sit inside the panel
         as big blank gaps around the number buttons */
      #soloCalc,#remoteCalc{ flex:none; display:flex; }
      #soloCalc .calc,#remoteCalc .calc{ flex:none; width:100%; }

      /* ---------- mode bar ---------- */
      .modebar{ display:flex; gap:5px; align-items:stretch; margin:0 0 4px; flex-wrap:nowrap; flex:none; }
      .seg{ display:flex; flex:1 1 auto; background:rgba(10,20,46,.85); border:1px solid var(--line); padding:3px; gap:3px; min-width:0; clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px); }
      .seg button{
        flex:1; border:0; background:transparent; color:var(--ink-dim);
        font-weight:700; font-size:14px; padding:5px 2px; min-height:38px; white-space:nowrap;
        clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
      }
      .seg button[aria-pressed="true"]{ background:linear-gradient(180deg,var(--cyan-hi),var(--cyan)); color:#04101f; box-shadow:inset 0 1px 0 #fff, 0 0 14px rgba(56,207,255,.35); }
      .barbtn{
        border:1px solid var(--line); background:rgba(10,20,46,.85); color:var(--ink);
        padding:0 12px; font-weight:700; font-size:14px; min-height:42px;
        display:inline-flex; align-items:center; gap:6px; flex:none;
        clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
      }
      @media (max-width:520px){
        .barbtn{ padding:0 10px; }
        .barbtn .barlabel{ display:none; }
        .seg button{ font-size:13px; }
      }
      .barbtn:active{ background:var(--bg-panel2); transform:translateY(1px); }
      #soundBtn[aria-pressed="false"]{ color:var(--ink-faint); }
      .barbtn svg{ width:18px; height:18px; flex:none; }
      .barbtn.danger{ color:#ffb3bc; border-color:#5b2333; }

      /* ---------- player card ---------- */
      /* the player card IS a Master Duel LP plate: deep navy panel with
         angled cut corners, a glowing cyan top edge, and the LP number
         large and italic in ice white. No name bar in solo (labels are
         hidden there); remote keeps a plain name row. */
      .pcard{
        position:relative; background:linear-gradient(165deg,#12234d 0%, #0a142e 55%, #060d22 100%);
        border:1px solid var(--line);
        clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);
        box-shadow:inset 0 0 0 1px rgba(87,200,255,.12), inset 0 1px 0 rgba(174,234,255,.18), 0 8px 26px rgba(0,0,0,.5);
        padding:7px 10px 6px; margin-bottom:4px; overflow:hidden; flex:none;
      }
      /* glowing top edge, like the MD plate highlight */
      .pcard::before{ content:""; position:absolute; top:0; left:18px; right:0; height:2px; background:linear-gradient(90deg, var(--cyan), rgba(56,207,255,0) 65%); box-shadow:0 0 10px rgba(56,207,255,.7); z-index:2; }
      .pcard::after{ content:""; position:absolute; inset:5px; border:1px solid rgba(87,200,255,.10); pointer-events:none; z-index:1; }
      .pcard[data-p="0"]{ --ac:var(--p1); }
      .pcard[data-p="1"]{ --ac:var(--p2); }
      .phead{
        display:flex; align-items:center; gap:8px; position:relative; z-index:2;
        background:transparent; border:0; padding:2px 2px 0;
      }
      /* solo hides labels: the whole head row (dot only) goes away */
      #soloCard .phead{ display:none; }
      .pdot{
        /* the player dot becomes a small glowing diamond */
        width:11px; height:11px; border-radius:0; flex:none;
        background:linear-gradient(135deg,var(--cyan-hi),var(--cyan-deep));
        transform:rotate(45deg);
        box-shadow:0 0 6px rgba(56,207,255,.6);
      }
      .pcard[data-p="1"] .pdot{ background:linear-gradient(135deg,#ffc2cb,var(--rose)); box-shadow:0 0 6px rgba(255,91,116,.6); }
      .pname{
        color:var(--ink); font-weight:900; font-size:15px; padding:2px 2px; min-height:26px;
        display:inline-flex; align-items:center; max-width:260px; min-width:0;
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      }
      .ptag{ margin-left:auto; font-size:11px; font-weight:700; color:var(--ink-faint); letter-spacing:.08em; white-space:nowrap; }
      /* the LP sits directly on the plate — no inner art window */
      .lpwrap{
        display:flex; align-items:baseline; gap:10px; margin-top:2px; position:relative; z-index:2;
        background:none; border:0; border-radius:0; padding:2px 4px 0;
        box-shadow:none;
      }
      .lplabel{ font-family:"Rajdhani",sans-serif; font-size:14px; font-weight:700; color:var(--ac); letter-spacing:.3em; flex:none; text-shadow:0 0 10px rgba(56,207,255,.6); }
      .lp{
        /* Fixed-width slot sized for the system maximum "99900" (5 digits, no
           thousands separator): the box never grows or shrinks with the digit
           count, so the card layout, the LP bar and everything around the
           number stay put. Right-aligned inside the slot, so the right edge
           (and the slot itself) is always fixed. */
        display:inline-block; flex:none; width:3.1em; min-width:3.1em; max-width:3.1em; text-align:right;
        font-style:italic;
        font-size:clamp(52px,15vw,84px); font-weight:700; line-height:1.02; color:var(--ice);
        /* battery: glow kept to two layers — the old third layer (96-110px
           blur) was the single most expensive paint on a phone GPU and is
           nearly invisible at these sizes. */
        text-shadow:0 0 14px rgba(120,210,255,.55), 0 0 42px rgba(56,160,255,.30), 0 2px 0 rgba(10,40,90,.9);
      }
      .pcard[data-p="1"] .lp{ text-shadow:0 0 14px rgba(255,120,145,.5), 0 0 42px rgba(255,59,87,.28), 0 2px 0 rgba(60,8,20,.9); }
      .lp.low{ color:var(--amber); text-shadow:0 0 14px rgba(255,217,104,.55), 0 0 42px rgba(255,180,40,.3); }
      .lp.ko{ color:var(--red); text-shadow:0 0 16px rgba(255,59,87,.65), 0 0 46px rgba(255,59,87,.35); }
      /* solo: the LP number is the hero of the whole screen */
      #soloCard .pcard{ padding:8px 10px 7px; }
      #soloCard .lp{ font-size:clamp(76px,22vw,132px); letter-spacing:.01em; }
      #soloCard .lplabel{ font-size:13px; }
      .kobadge{
        /* out of flow (card corner) so appearing at K.O. never widens the LP row */
        display:none; position:absolute; top:10px; right:12px; z-index:3;
        font-family:"Rajdhani",sans-serif; font-weight:700; font-size:16px; color:#fff;
        background:linear-gradient(180deg,#ff5b74,var(--red-deep)); padding:3px 12px 2px; letter-spacing:.18em;
        clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);
        box-shadow:0 0 18px rgba(255,59,87,.55);
      }
      /* battery: pulse a few times when K.O. happens, then rest static —
         an infinite pulse keeps the compositor waking up for the whole
         rest of the duel. */
      .pcard.is-ko .kobadge{ display:inline-block; animation:kopulse .55s ease-in-out 6; }
      @keyframes kopulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.07);} }
      /* segmented LP gauge, angled like the MD bar */
      .lpbar{ height:8px; background:#050b1e; border:1px solid rgba(87,200,255,.35); margin-top:5px; overflow:hidden; position:relative; z-index:2; clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%); }
      .lpbar > i{ display:block; height:100%; background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0) 55%), linear-gradient(90deg,#1e7fff,var(--cyan)); box-shadow:0 0 12px rgba(56,207,255,.55); transition:width .45s cubic-bezier(.22,1,.36,1); }
      .lpbar.low > i{ background:linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0) 55%), linear-gradient(90deg,#e8930c,var(--amber)); }
      .lpbar.ko > i{ background:linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,0) 55%), var(--red); }
      .flash-dmg{ animation:flashdmg .55s ease-out; }
      .flash-heal{ animation:flashheal .55s ease-out; }
      @keyframes flashdmg{ 0%{ box-shadow:0 0 0 3px var(--red), 0 0 44px rgba(255,59,87,.5);} 100%{ box-shadow:0 0 0 0 transparent;} }
      @keyframes flashheal{ 0%{ box-shadow:0 0 0 3px var(--green), 0 0 44px rgba(47,230,200,.45);} 100%{ box-shadow:0 0 0 0 transparent;} }
      .shake{ animation:shake .4s ease-in-out; }
      @keyframes shake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 45%{transform:translateX(5px);} 70%{transform:translateX(-3px);} 90%{transform:translateX(2px);} }

      /* ---------- keypad block ---------- */
      /* the keypad block is an MD console panel with angled corners */
      .calc{ background:linear-gradient(180deg, rgba(16,30,64,.92), rgba(7,13,32,.94)); border:1px solid var(--line); clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px); box-shadow:inset 0 0 0 1px rgba(87,200,255,.10), inset 0 1px 0 rgba(174,234,255,.14); padding:8px 10px 9px; margin-bottom:0; display:flex; flex-direction:column; flex:1; min-height:0; }
      /* The amount being built is the readout of the keypad, so it gets
         the big type: a single centred row, nothing else competing with
         it. The correction tools (C and the − chips) live in their own
         spread-out row directly beneath it — see .subrow — because they
         edit THIS number, and grouping them here says so at a glance. */
      .amtdisp{ display:flex; align-items:center; justify-content:center; padding:2px 4px 0; height:56px; min-height:56px; flex:none; width:100%; }
      .amt{ font-size:clamp(38px,10.5vw,48px); font-weight:700; color:var(--cyan-hi); line-height:1; white-space:nowrap; text-align:center; display:block; text-shadow:0 0 14px rgba(56,207,255,.45); }
      .amt.empty{ color:var(--ink-faint); text-shadow:none; }
      /* amount is built ONLY from the denomination buttons (100 / 500 /
         1000 / 2000) — no digit keypad, and no + sign on the buttons:
         adding is the one default action, so the bare number carries it.
         The − chips correct a mis-tap in place only: with NO amount
         being entered they do not change LP at all. The number buttons
         sit in a 2×2 grid of squarish tiles — 100 / 500 on the top
         row, 1000 / 2000 below — instead of 4 full-width strips, so
         each denomination is a compact block that's easy to hit. */
      .subrow{ display:flex; gap:6px; align-items:stretch; padding:4px 0 8px; flex:none; width:100%; }
      .clrbtn{
        /* steel-blue utility face, matching the sample's C button */
        border:1px solid #54749f; background:linear-gradient(180deg,#33507e,#1b2c52); color:var(--ice);
        font-family:"Rajdhani","Zen Kaku Gothic New",sans-serif;
        font-weight:700; font-size:17px; height:42px; min-height:42px; padding:0 4px; flex:1 1 0; min-width:0;
        display:flex; align-items:center; justify-content:center; line-height:1;
        clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
        text-shadow:0 1px 2px rgba(0,0,0,.5);
        box-shadow:inset 0 1px 0 rgba(220,242,255,.35), inset 0 -2px 0 rgba(2,6,18,.6);
      }
      .clrbtn:active{ background:linear-gradient(180deg,#243c66,#14233f); transform:translateY(1px); }
      /* Addition tiles keep a fixed height instead of stretching to
         fill the tablet: the grid area still flexes, but the rows are
         capped and centred in it, so extra screen height becomes even
         breathing room around the group rather than taller buttons.
         At phone widths a tile is ~180px wide × 100px tall — a
         squarish block, well above the 44px tap minimum. */
      .quick{ display:grid; grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(2,100px); gap:6px; flex:1; min-height:0; align-content:center; }
      /* number chips wear a Blue-Eyes silver plate face; − chips are red */
      .qbtn{
        border:1px solid #d9e9fb; background:linear-gradient(180deg,var(--silver-hi),var(--silver) 52%,var(--silver-lo)); color:#0a1c3d;
        font-weight:700; font-size:clamp(24px,6.5vw,32px); padding:4px 0; min-height:44px; letter-spacing:.05em;
        clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
        text-shadow:0 1px 0 rgba(255,255,255,.6);
        box-shadow:inset 0 1px 0 #fff, inset 0 -2px 0 rgba(30,60,110,.4);
      }
      .qbtn:active{ background:linear-gradient(180deg,#b9cee8,#84a3c9); transform:translateY(1px); }
      .qbtn.qsub{
        background:linear-gradient(180deg,#d92b47,#8f1226); border-color:#ff7d90; color:#ffe3e8;
        text-shadow:0 1px 2px rgba(0,0,0,.45);
        box-shadow:inset 0 1px 0 rgba(255,190,200,.4), inset 0 -2px 0 rgba(40,2,10,.55);
      }
      .qbtn.qsub:active{ background:#6d0d1e; }
      /* the − chips in the correction row: same red face as ever,
         just at utility size, spread evenly beside C */
      .subrow .qbtn{ flex:1 1 0; min-width:0; height:42px; min-height:42px; padding:2px 0; font-size:clamp(13px,3.8vw,17px); }
      .acts{ display:grid; grid-template-columns:1fr auto 1fr; gap:6px; margin-top:6px; flex:none; }
      .act{
        font-weight:900; font-size:18px; padding:8px 0; min-height:48px; color:#fff;
        display:flex; align-items:center; justify-content:center; gap:8px;
        clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px);
      }
      .act.dmg{ background:linear-gradient(180deg,#e02444,#9c1128); border:1px solid #ff6b7f; box-shadow:0 0 16px rgba(255,59,87,.30), inset 0 1px 0 rgba(255,200,208,.4); }
      .act.dmg:active{ background:#7d0d20; }
      .act.heal{ background:linear-gradient(180deg,#0d9fd8,#075a96); border:1px solid #54d4ff; box-shadow:0 0 16px rgba(56,207,255,.32), inset 0 1px 0 rgba(200,242,255,.45); }
      .act.heal:active{ background:#064a7c; }
      .act.half{ background:#0a1734; border:1px solid var(--line-bright); color:var(--cyan-hi); font-family:"Rajdhani",sans-serif; font-size:21px; padding:8px 16px; min-width:84px; text-shadow:0 0 8px rgba(56,207,255,.5); }
      /* symbol-only actions: the glyph + color carry the meaning, no word labels */
      .act.dmg,.act.heal{ font-size:30px; line-height:1; padding:5px 0; }
      .calc.mini .act.dmg,.calc.mini .act.heal{ font-size:26px; }
      .act:disabled{ opacity:.38; box-shadow:none; }
      /* dimmed-but-tappable state for the − / ＋ actions when no amount is
         entered yet: a real disabled button swallows the tap silently,
         which reads as "not responding" — the class only dims, and the
         click handler answers with the hint wiggle below */
      .act.off{ opacity:.38; box-shadow:none; }
      /* feedback for taps that change nothing on their own: the amount
         row wiggles (enter a number with the chips first), and a
         corrected amount pulses so a − chip tap visibly registers */
      .calc.hint .amtdisp{ animation:shake .32s ease-in-out; }
      .amt.bump{ animation:amtbump .28s ease; }
      @keyframes amtbump{ 0%{ transform:scale(1);} 35%{ transform:scale(1.18);} 100%{ transform:scale(1);} }

      /* compact variant (legacy hooks kept minimal) */
      .calc.mini{ padding:7px; margin:6px 0 0; background:rgba(7,13,32,.85); }
      .calc.mini .amtdisp{ height:48px; min-height:48px; padding-bottom:2px; }
      .calc.mini .amt{ font-size:32px; }
      .calc.mini .quick{ grid-template-rows:repeat(2,84px); gap:5px; }
      .calc.mini .qbtn{ min-height:44px; font-size:24px; }
      .calc.mini .subrow .qbtn,.calc.mini .clrbtn{ height:40px; min-height:40px; }
      .calc.mini .act{ min-height:38px; font-size:15px; padding:6px 0; }
      .calc.mini .act.half{ font-size:16px; padding:6px 10px; min-width:64px; }
      .calc.mini .quick,.calc.mini .acts{ gap:5px; }
      .calc.mini .acts{ margin-top:5px; }

      /* ---------- remote ---------- */
      /* two stages: lobby (room create / join only, no calculator) and
         battle (shown automatically once connected). */
      #view-remote{ overflow:hidden; }
      #remoteLobby{ flex:0 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
      #remoteBattle{ flex:0 1 auto; min-height:0; display:flex; flex-direction:column; }
      #remoteBattle #remoteCalc{ flex:none; min-height:0; display:flex; }
      .battlebar{ display:flex; align-items:center; gap:8px; margin-bottom:6px; flex:none; }
      .battlebar .sp{ flex:1; }
      .battlebar .barbtn{ min-height:40px; }
      .rpanel{ background:var(--bg-panel); border:1px solid var(--line); clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px); padding:12px; margin-bottom:8px; flex:none; }
      .rpanel.collapsed .hideable{ display:none !important; }
      .rpanel.collapsed .roomcode{ font-size:20px; padding:4px 10px; }
      .rpanel.collapsed .codebox{ margin:6px 0; }
      #remoteCards{ display:flex; flex-direction:column; gap:6px; margin-bottom:6px; flex:none; }
      #remoteCards .pcard{ margin-bottom:0; }
      #remoteCards .ptag{ display:none; }
      #remoteCards .kobadge{ font-size:12px; padding:2px 7px; }
      /* own card: full size, directly above the keypad */
      #remoteCards .pcard.is-self{ order:2; padding:10px 12px 9px; }
      #remoteCards .pcard.is-self .lp{ font-size:clamp(58px,16vw,88px); }
      #remoteCards .pcard.is-self .pname{ color:var(--ink); }
      #remoteCards .pcard.is-self .pname{ font-size:14px; max-width:220px; }
      #remoteCards .pcard.is-self .lpbar{ margin-top:6px; height:8px; }
      /* opponent: LP-only strip */
      #remoteCards .pcard.is-opp{ order:1; display:flex; align-items:center; gap:10px; padding:7px 12px; }
      #remoteCards .pcard.is-opp .phead{ flex:0 1 auto; min-width:0; }
      #remoteCards .pcard.is-opp .pname{ font-size:13px; max-width:120px; pointer-events:none; }
      #remoteCards .pcard.is-opp .lpwrap{ margin:0 0 0 auto; gap:6px; flex:none; background:none; border:0; box-shadow:none; padding:0; }
      #remoteCards .pcard.is-opp .lp{ font-size:38px; }
      #remoteCards .pcard.is-opp .lpbar{ display:none; }
      .rpanel h2{ margin:0 0 6px; font-size:17px; font-weight:900; }
      .rpanel p{ margin:0 0 10px; color:var(--ink-dim); font-size:13.5px; line-height:1.65; }
      .status{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:13px; padding:7px 10px; border:1px solid var(--line); background:#050b1e; margin-bottom:8px; flex:none; clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }
      .sdot{ width:11px; height:11px; border-radius:50%; background:var(--ink-faint); flex:none; }
      .sdot.on{ background:var(--green); box-shadow:0 0 9px var(--green); }
      .sdot.wait{ background:var(--amber); box-shadow:0 0 9px var(--amber); animation:kopulse 1.2s ease-in-out 4; }
      .sdot.err{ background:var(--red); box-shadow:0 0 9px var(--red); }
      .bigbtn{
        width:100%; border:1px solid var(--cyan-hi); color:#04101f;
        background:linear-gradient(180deg,var(--cyan-hi),var(--cyan) 55%,#1e9fff); font-weight:900; font-size:16px; padding:10px; min-height:48px;
        clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px);
        box-shadow:0 0 16px rgba(56,207,255,.30), inset 0 1px 0 #fff;
      }
      .bigbtn:active{ filter:brightness(.92); }
      .bigbtn.ghost{ background:#0a1734; color:var(--cyan); border-color:var(--line); box-shadow:none; }
      .codebox{ display:flex; gap:8px; align-items:stretch; margin:10px 0; flex-wrap:wrap; }
      .roomcode{
        font-family:"Rajdhani",sans-serif; font-weight:700; font-size:30px; letter-spacing:.22em; color:var(--cyan-hi);
        background:#050b1e; border:1px solid var(--line-bright); padding:8px 14px; text-align:center; flex:1; min-width:170px;
        clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
        box-shadow:inset 0 0 12px rgba(0,0,0,.7);
        text-shadow:0 0 12px rgba(56,207,255,.5);
      }
      .linkrow{ display:flex; gap:8px; }
      .linkrow input{
        flex:1; min-width:0; background:#050b1e; border:1px solid var(--line); border-radius:10px; color:var(--ink-dim);
        font-size:12.5px; padding:10px; min-height:48px;
      }
      .copybtn{ border:1px solid var(--line); background:#12234d; color:#fff; border-radius:10px; font-weight:800; padding:0 16px; min-height:48px; white-space:nowrap; }
      .qrwrap{ display:flex; gap:14px; align-items:center; margin-top:12px; flex-wrap:wrap; }
      .qr{ background:#fff; padding:8px; border-radius:10px; line-height:0; }
      .qr img,.qr canvas{ width:132px !important; height:132px !important; }
      .qrnote{ color:var(--ink-dim); font-size:12.5px; line-height:1.6; max-width:250px; }
      .joinrow{ display:flex; gap:8px; }
      .joinrow input{
        flex:1; min-width:0; text-transform:uppercase; background:#050b1e; border:1px solid var(--line); border-radius:10px;
        color:#fff; font-family:"Rajdhani",sans-serif; font-weight:700; font-size:19px; letter-spacing:.18em; padding:10px 12px; min-height:52px; text-align:center;
      }
      .joinrow button{ border:1px solid var(--line-bright); background:#12234d; color:var(--cyan); border-radius:10px; font-weight:900; padding:0 20px; min-height:52px; }
      .divider{ display:flex; align-items:center; gap:10px; color:var(--ink-faint); font-size:12px; font-weight:700; margin:16px 0 12px; }
      .divider::before,.divider::after{ content:""; flex:1; height:1px; background:var(--line-soft); }
      .selhint{ font-size:12px; color:var(--ink-dim); margin:0 2px 6px; flex:none; }
      .calc.disabled{ opacity:.45; pointer-events:none; }

      /* ---------- history ---------- */
      .histhead{ display:flex; align-items:center; gap:8px; margin:10px 2px 8px; }
      .histhead h2{ font-size:16px; font-weight:900; margin:0; }
      .histhead .count{ color:var(--ink-faint); font-size:12.5px; font-weight:700; }
      .histhead .sp{ flex:1; }
      .hrow{
        display:grid; grid-template-columns:30px 1fr auto auto 40px; gap:8px; align-items:center;
        background:var(--bg-panel); border:1px solid var(--line-soft); border-radius:10px; padding:7px 8px 7px 10px; margin-bottom:6px;
      }
      .hrow .no{ color:var(--ink-faint); font-size:12px; font-weight:700; text-align:center; }
      .hrow .who{ font-weight:800; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .hrow .who i{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
      .hrow .chg{ font-weight:800; font-size:16px; }
      .hrow .chg.dmg{ color:#ff9aa8; } .hrow .chg.heal{ color:#7df0e4; } .hrow .chg.set{ color:var(--amber); }
      .hrow .after{ color:var(--ink-dim); font-size:14px; white-space:nowrap; }
      .hrow .after b{ color:#fff; font-size:16px; display:inline-block; min-width:3.1em; text-align:right; }
      .hdel{ border:0; background:transparent; color:var(--ink-faint); border-radius:8px; min-width:40px; min-height:40px; font-size:16px; }
      .hdel:active{ color:#ff9aa8; background:#12234d; }
      .hempty{ color:var(--ink-faint); font-size:13.5px; text-align:center; padding:16px 0 6px; }
      /* history is a bottom sheet in every mode, so the calculator never scrolls */
      #historySec{
        position:fixed; inset:auto 0 0 0; max-height:74dvh; overflow:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; z-index:40;
        background:#060d22; border-top:1px solid var(--line-bright); border-radius:18px 18px 0 0; padding:6px 14px 26px;
        box-shadow:0 -12px 40px rgba(0,0,0,.6), 0 -2px 18px rgba(56,160,255,.18);
        transform:translateY(105%); transition:transform .28s ease;
      }
      #historySec.sheet{ transform:translateY(0); }
      .sheetback{ position:fixed; inset:0; background:rgba(2,5,16,.6); z-index:39; }

      /* ---------- modal / toast ---------- */
      .modalback{ position:fixed; inset:0; background:rgba(2,5,16,.74); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; }
      .modal{ background:linear-gradient(180deg,var(--bg-panel2),var(--bg-panel)); border:1px solid var(--line-bright); clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px); padding:20px; max-width:360px; width:100%; box-shadow:0 0 30px rgba(56,160,255,.25); }
      .modal h3{ margin:0 0 8px; font-size:18px; font-weight:900; }
      .modal p{ margin:0 0 16px; color:var(--ink-dim); font-size:14px; line-height:1.6; }
      .modal .row{ display:flex; gap:8px; }
      .modal button{ flex:1; font-weight:900; font-size:15px; padding:13px; min-height:52px; border:0; clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px); }
      .modal .cancel{ background:#12234d; border:1px solid var(--line); color:var(--ink); }
      .modal .ok{ background:linear-gradient(180deg,#e02444,#9c1128); border:1px solid #ff6b7f; color:#fff; }
      .modal.modal-reset{ padding:14px; max-width:320px; }
      .modal.modal-reset .row{ gap:10px; }

        var ctx = ensureAudio();
        if (!ctx || ctx.state !== 'running') return;
        var t = ctx.currentTime;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(3297, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.095, t + 0.005);
        gain.gain.setValueAtTime(0.095, t + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.064);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.09);
      }
      /* one layer of the landing beep: a fixed-pitch tone that may
         STEP once, instantly, from freqA to freqB at stepAt — the
         frequency is set with setValueAtTime only, never ramped, so
         there is no glide anywhere in the landing sound. */
      function beepLayer(ctx, t, type, freqA, freqB, stepAt, dur, vol){
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freqA, t);
        if (freqB && freqB !== freqA) osc.frequency.setValueAtTime(freqB, t + stepAt);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(vol, t + 0.003);
        gain.gain.setValueAtTime(vol, t + Math.max(0.004, dur - 0.09));
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + dur + 0.05);
      }
      /* the landing the moment the roll stops, as measured from the
         user's life.mp3 (FFT over the clip's final ~250ms): a sine
         "pi-yon" in three fast moves — (1) a hard attack at ~1250Hz,
         louder than anything in the pulse train; (2) a quick DIP to
         ~917Hz over ~45ms, with a short hold — this downward scoop
         is the "ti-un" the user heard; (3) a jump UP to a fixed
         ~2500Hz, which then simply decays in place (~250ms total),
         a faint ~4250Hz sine riding along. An earlier version that
         STARTED at the high pitch (a 2093→2637Hz step) sounded too
         high and hard precisely because it skipped the low attack
         and the dip; a slow smooth glide sounded like an FF menu.
         At 0 LP three fixed-pitch beeps step down after the ring. */
      function playFinalSound(toZero){
        if (!soundOn || document.hidden) return;
        var ctx = ensureAudio();
        if (!ctx || ctx.state !== 'running') return;
        var t = ctx.currentTime;
        /* primary: the recording's own landing. When the roll ran on
           the straight-through playback, that landing is sounding at
           exactly this moment from within the stream — never double
           it; the segment below is played only when the roll ran on
           the synth fallback (buffer decoded too late to start it).
           The K.O. beeps keep their timing after it either way. */
        if (seBuffer && !rollOnSynth){
          var inStream = seRollSrc && (t - seRollStartedAt) < (SE_LAND_START - SE_ROLL_START) + 0.25;
          if (!inStream){
            try {
              var lsrc = ctx.createBufferSource();
              lsrc.buffer = seBuffer;
              var lg = ctx.createGain();
              lg.gain.setValueAtTime(SE_GAIN, t);
              lsrc.connect(lg); lg.connect(ctx.destination);
              lsrc.start(t, SE_LAND_START, SE_LAND_DUR + 0.05);
            } catch(e){}
          }
          if (toZero){
            beepLayer(ctx, t + 0.36, 'square', 2093, 0, 0, 0.09, 0.04);
            beepLayer(ctx, t + 0.36, 'sine',   2093, 0, 0, 0.09, 0.045);
            beepLayer(ctx, t + 0.47, 'square', 1568, 0, 0, 0.09, 0.04);
            beepLayer(ctx, t + 0.47, 'sine',   1568, 0, 0, 0.09, 0.045);
            beepLayer(ctx, t + 0.58, 'square', 1046, 0, 0, 0.18, 0.045);
            beepLayer(ctx, t + 0.58, 'sine',   1046, 0, 0, 0.18, 0.05);
          }
          return;
        }
        /* fallback landing (synth scoop): 1250 -> dip 917 -> fixed 2500 */
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1250, t);
        osc.frequency.exponentialRampToValueAtTime(917, t + 0.045);
        osc.frequency.setValueAtTime(917, t + 0.07);
        osc.frequency.exponentialRampToValueAtTime(2500, t + 0.11);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.12, t + 0.004);
        gain.gain.exponentialRampToValueAtTime(0.05, t + 0.16);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.33);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.36);
        /* bright companion: ~4250Hz sine joining at the jump, gone
           sooner than the main ring */
        var osc2 = ctx.createOscillator();
        var gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(4252, t);
        gain2.gain.setValueAtTime(0.0001, t);
        gain2.gain.exponentialRampToValueAtTime(0.045, t + 0.115);
        gain2.gain.exponentialRampToValueAtTime(0.0001, t + 0.27);
        osc2.connect(gain2); gain2.connect(ctx.destination);
        osc2.start(t + 0.06); osc2.stop(t + 0.3);
        if (toZero){
          beepLayer(ctx, t + 0.36, 'square', 2093, 0, 0, 0.09, 0.04);
          beepLayer(ctx, t + 0.36, 'sine',   2093, 0, 0, 0.09, 0.045);
          beepLayer(ctx, t + 0.47, 'square', 1568, 0, 0, 0.09, 0.04);
          beepLayer(ctx, t + 0.47, 'sine',   1568, 0, 0, 0.09, 0.045);
          beepLayer(ctx, t + 0.58, 'square', 1046, 0, 0, 0.18, 0.045);
          beepLayer(ctx, t + 0.58, 'sine',   1046, 0, 0, 0.18, 0.05);
        }
      }
      var lastPulseAt = 0;

      /* ---- roll state (per player; every card of that player shows
         the same displayed value) ---- */
      var dispLps = [START_LP, START_LP];
      var rolls = [null, null];
      var lpPrimed = false;    /* first paint is instant */
      var forceInstant = false; /* first snapshot after connecting */
      var REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      function paintLp(p){
        var txt = fmt(dispLps[p]);
        document.querySelectorAll('[data-lp="'+p+'"]').forEach(function(elm){
          if (elm.textContent !== txt) elm.textContent = txt;
        });
      }
      function rollDuration(delta){
        /* fixed: the reference recording's full 尺 — first pulse to
           landing attack — whatever the size of the change, so the
           number and the sound always run exactly as long as the
           clip played fresh */
        return SE_ROLL_MS;
      }
      function startRoll(p, to){
        var from = dispLps[p];
        var delta = to - from;
        if (delta === 0 || REDUCED_MOTION){ finishRoll(p, to, false); return; }
        var roll = rolls[p];
        if (!roll){
          roll = rolls[p] = { raf:0 };
          /* a fresh roll starts the counter sound. The first pulse
             lands about 30ms in, once the drone has faded in, like
             the reference clip's lead-in. */
          startDrone();
          if (!rolls[1 - p]) lastPulseAt = performance.now() - 80;
        } else {
          /* retargeted mid-roll: the renewed change also gets the
             full 尺 — restart the recording from its first pulse so
             the sound and the number start over in step */
          restartSeRoll();
          if (!rolls[1 - p]) lastPulseAt = performance.now() - 80;
        }
        /* retargeting mid-roll starts from the value on screen now */
        roll.from = from; roll.to = to; roll.delta = delta;
        roll.dmg = delta < 0;
        roll.start = performance.now();
        roll.dur = rollDuration(delta);
        if (!roll.raf) roll.raf = requestAnimationFrame(function(ts){ stepRoll(p, ts); });
      }
      function stepRoll(p, ts){
        var roll = rolls[p];
        if (!roll) return;
        roll.raf = 0;
        if (document.hidden){ finishRoll(p, roll.to, false); return; }
        var t = (ts - roll.start) / roll.dur;
        if (t >= 1){ finishRoll(p, roll.to, true); return; }
        var e = 1 - Math.pow(1 - t, 3); /* ease-out cubic: fast, then settles */
        var v = Math.round(roll.from + (roll.to - roll.from) * e);
        if (v !== dispLps[p]){ dispLps[p] = v; paintLp(p); }
        /* the 3300Hz "pi" pulses ride on the drone at the reference
           clip's ~110ms cycle — one shared train, so two simultaneous
           rolls still sound like a single counter */
        if (ts - lastPulseAt >= 110){ lastPulseAt = ts; playPulse(); }
        roll.raf = requestAnimationFrame(function(ts2){ stepRoll(p, ts2); });
      }
      function finishRoll(p, to, withSound){
        var roll = rolls[p];
        if (roll && roll.raf) cancelAnimationFrame(roll.raf);
        rolls[p] = null;
        dispLps[p] = to; /* the landed value is always the exact LP */
        paintLp(p);
        if (withSound && roll && seRollSrc){
          /* a sounding landing on the recording: the playback runs
             straight on into its own landing attack and ends by
             itself — stopping it here would cut the landing off.
             Only silent finishes and the synth drone stop here. */
        } else {
          stopDroneIfIdle();
        }
        if (withSound && roll) playFinalSound(to <= 0);
        if (!rolls[0] && !rolls[1]) rollOnSynth = false;
      }
      function finishAllRolls(){
        for (var p = 0; p < 2; p++){ if (rolls[p]) finishRoll(p, rolls[p].to, false); }
      }

      function amtNum(ctx){ var n = parseInt(amounts[ctx] || '0', 10); return isNaN(n) ? 0 : n; }
      function fmt(n){ return String(n); }

      /* ============ DOM builders ============ */
      function el(html){ var d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }

      function playerCardHTML(p, opts){
        opts = opts || {};
        var cls = 'pcard';
        /* hideLabels (solo): no player-name label, no 'PLAYER N' tag,
           no 'LP' label — the colored dot and the hero LP number say it all.
           Remote keeps its labels; its layout is handled separately. */
        var nameBits = opts.hideLabels ? '' :
            '<span class="pname" data-namelabel="'+p+'">プレイヤー'+(p+1)+'</span>' +
            '<span class="ptag">'+(opts.tag || '')+'</span>';
        var lpLabel = opts.hideLabels ? '' : '<span class="lplabel">LP</span>';
        return '' +
        '<div class="'+cls+'" data-p="'+p+'" data-card="'+p+'" id="card-'+opts.idkey+'-'+p+'">' +
          '<div class="phead">' +
            '<span class="pdot"></span>' +
            nameBits +
          '</div>' +
          '<div class="lpwrap">' + lpLabel +
            '<span class="lp num" data-lp="'+p+'">8000</span>' +
            '<span class="kobadge">K.O.</span>' +
          '</div>' +
          '<div class="lpbar" data-bar="'+p+'"><i style="width:100%"></i></div>' +
        '</div>';
      }

      function calcHTML(ctx, p){
        return '' +
        '<div class="calc" data-ctx="'+ctx+'" data-p="'+p+'">' +
          '<div class="amtdisp">' +
            '<span class="amt num empty" data-amt>0</span>' +
          '</div>' +
          '<div class="subrow">' +
            '<button type="button" class="clrbtn" data-k="clr" aria-label="入力をクリア">C</button>' +
            '<button type="button" class="qbtn num qsub" data-chip-sub="100">−100</button>' +
            '<button type="button" class="qbtn num qsub" data-chip-sub="500">−500</button>' +
            '<button type="button" class="qbtn num qsub" data-chip-sub="1000">−1000</button>' +
            '<button type="button" class="qbtn num qsub" data-chip-sub="2000">−2000</button>' +
          '</div>' +
          '<div class="quick">' +
            '<button type="button" class="qbtn num" data-chip="100">100</button>' +
            '<button type="button" class="qbtn num" data-chip="500">500</button>' +
            '<button type="button" class="qbtn num" data-chip="1000">1000</button>' +
            '<button type="button" class="qbtn num" data-chip="2000">2000</button>' +
          '</div>' +
          '<div class="acts">' +
            '<button type="button" class="act dmg" data-act="dmg" aria-label="ダメージ">−</button>' +
            '<button type="button" class="act half" data-act="half" aria-label="半分にする">÷2</button>' +
            '<button type="button" class="act heal" data-act="heal" aria-label="回復">＋</button>' +
          '</div>' +
        '</div>';
      }

      /* solo */
      document.getElementById('soloCard').appendChild(el(playerCardHTML(0, {idkey:'solo', tag:'PLAYER 1', hideLabels:true})));
      document.getElementById('soloCalc').appendChild(el(calcHTML('solo', 0)));
      /* remote */
      var rc = document.getElementById('remoteCards');
      rc.appendChild(el(playerCardHTML(0, {idkey:'remote', tag:'PLAYER 1'})));
      rc.appendChild(el(playerCardHTML(1, {idkey:'remote', tag:'PLAYER 2'})));
      document.getElementById('remoteCalc').appendChild(el(calcHTML('remote', 0)));

      /* ============ rendering ============ */
      function renderPlayer(p, cur){
        document.querySelectorAll('[data-card="'+p+'"]').forEach(function(card){
          var lpEl = card.querySelector('[data-lp]');
          var bar = card.querySelector('[data-bar]');
          var barFill = bar.querySelector('i');
          /* write only on change: a same-value textContent write still
             repaints the LP number's layered glow text-shadow, the most
             expensive paint on the page — and renders fire on every
             connection-status event, not just on LP changes. */
          /* the number shows the roll's displayed value (dispLps), which
             equals cur whenever no roll is running; classes/bar use the
             confirmed target value */
          var txt = fmt(dispLps[p]);
          if (lpEl.textContent !== txt) lpEl.textContent = txt;
          lpEl.classList.toggle('low', cur > 0 && cur <= LOW_LP);
          lpEl.classList.toggle('ko', cur <= 0);
          bar.classList.toggle('low', cur > 0 && cur <= LOW_LP);
          bar.classList.toggle('ko', cur <= 0);
          var w = Math.max(0, Math.min(100, cur / START_LP * 100)) + '%';
          if (barFill.style.width !== w) barFill.style.width = w;
          card.classList.toggle('is-ko', cur <= 0);
        });
        document.querySelectorAll('[data-namelabel="'+p+'"]').forEach(function(lbl){
          if (lbl.textContent !== state.players[p].name) lbl.textContent = state.players[p].name;
        });
        document.querySelectorAll('[data-rotlp="'+p+'"]').forEach(function(s){ s.textContent = fmt(cur); });
      }

      /* remote: you operate only your own LP; the opponent is an LP-only strip.
         Host = player 1, guest = player 2. Before connecting, default to player 1. */
      function layoutRemote(){
        var self = (typeof role !== 'undefined' && role === 'guest') ? 1 : 0;
        remoteSel = self;
        document.querySelectorAll('#remoteCards .pcard').forEach(function(card){
          var p = parseInt(card.getAttribute('data-p'), 10);
          card.classList.toggle('is-self', p === self);
          card.classList.toggle('is-opp', p !== self);
          var lbl = card.querySelector('[data-namelabel]');
          if (lbl) lbl.style.opacity = (p === self) ? '' : '.85';
        });
      }

      function ctxPlayer(ctx){
        if (ctx === 'solo') return 0;
        if (ctx === 'remote') return remoteSel;
        return 0;
      }

      function renderCalc(ctx){
        var box = document.querySelector('.calc[data-ctx="'+ctx+'"]');
        if (!box) return;
        var p = ctxPlayer(ctx);
        var cur = lps()[p];
        var amtEl = box.querySelector('[data-amt]');
        var a = amounts[ctx];
        var atxt = a === '' ? '0' : fmt(parseInt(a,10) || 0);
        if (amtEl.textContent !== atxt) amtEl.textContent = atxt;
        amtEl.classList.toggle('empty', a === '');
        var n = amtNum(ctx);
        /* NOT the disabled attribute (nor aria-disabled, which tools
           and AT also read as inert): a disabled button swallows the
           tap silently, which reads as "broken". Dim via class only
           and let the tap trigger the enter-a-number hint in the
           handler — the button genuinely still responds. */
        ['dmg','heal'].forEach(function(k){
          box.querySelector('[data-act="'+k+'"]').classList.toggle('off', n <= 0);
        });
      }
      /* tap feedback helpers: pulse the pending amount when a − chip
         corrects it, and wiggle the amount row when an action button is
         tapped with nothing entered yet — a tap must never look dead */
      function bumpAmt(box){
        var amtEl = box.querySelector('[data-amt]');
        if (!amtEl) return;
        amtEl.classList.remove('bump');
        void amtEl.offsetWidth;
        amtEl.classList.add('bump');
      }
      var hintTimers = {};
      function hintCalc(box){
        var ctx = box.getAttribute('data-ctx');
        box.classList.remove('hint');
        void box.offsetWidth;
        box.classList.add('hint');
        if (hintTimers[ctx]) clearTimeout(hintTimers[ctx]);
        hintTimers[ctx] = setTimeout(function(){ box.classList.remove('hint'); }, 380);
      }
      function renderAllCalcs(){ ['solo','remote'].forEach(renderCalc); }

      var histSig = '';
      function renderHistory(){
        /* skip the full innerHTML rebuild when nothing that shows in the
           list changed (entry ids in order + player names fully determine
           the rows) — renders also fire on pure status changes. */
        var sig = state.history.map(function(e){ return e.id; }).join(',') +
                  '|' + state.players[0].name + '|' + state.players[1].name;
        if (sig === histSig) return;
        histSig = sig;
        var list = document.getElementById('histList');
        document.getElementById('histCount').textContent = state.history.length ? (state.history.length + ' 件') : '';
        if (!state.history.length){
          list.innerHTML = '<p class="hempty">履歴なし</p>';
          return;
        }
        var cur = lps();
        var html = '';
        for (var i = state.history.length - 1; i >= 0; i--){
          var e = state.history[i];
          var diff = e.after - e.before;
          var chg, cls;
          if (e.kind === 'half'){ chg = '÷2 ' + (diff <= 0 ? fmt(diff) : '+'+fmt(diff)); cls = 'set'; }
          else if (e.kind === 'set'){ chg = '→ ' + fmt(e.after); cls = 'set'; }
          else if (diff < 0){ chg = fmt(diff); cls = 'dmg'; }
          else { chg = '+' + fmt(diff); cls = 'heal'; }
          var color = e.p === 0 ? 'var(--p1)' : 'var(--p2)';
          html += '<div class="hrow">' +
            '<span class="no num">'+(i+1)+'</span>' +
            '<span class="who"><i style="background:'+color+'"></i>'+escapeHtml(state.players[e.p].name)+'</span>' +
            '<span class="chg num '+cls+'">'+chg+'</span>' +
            '<span class="after num">→ <b>'+fmt(e.after)+'</b></span>' +
            '<button type="button" class="hdel" data-del="'+e.id+'" aria-label="この行を取り消す">✕</button>' +
          '</div>';
        }
        list.innerHTML = html;
      }
      function escapeHtml(s){
        return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
      }

      function renderAll(flashP){
        passLps = replay();
        var cur = passLps;
        /* roll decisions come before painting: the first paint and the
           first post-connect snapshot are instant; every later confirmed
           change rolls (a mid-roll change retargets from the value on
           screen). Renders with no LP delta leave any running roll alone. */
        if (!lpPrimed){
          dispLps[0] = cur[0]; dispLps[1] = cur[1]; lpPrimed = true;
        } else {
          for (var rp = 0; rp < 2; rp++){
            if (cur[rp] !== prevLps[rp]){
              if (forceInstant){
                if (rolls[rp]){ if (rolls[rp].raf) cancelAnimationFrame(rolls[rp].raf); rolls[rp] = null; }
                dispLps[rp] = cur[rp];
                stopDroneIfIdle();
              } else {
                startRoll(rp, cur[rp]);
              }
            }
          }
        }
        layoutRemote();
        renderPlayer(0, cur[0]);
        renderPlayer(1, cur[1]);
        renderAllCalcs();
        renderHistory();
        if (typeof flashP === 'number'){
          var delta = cur[flashP] - prevLps[flashP];
          if (delta !== 0){
            document.querySelectorAll('[data-card="'+flashP+'"]').forEach(function(card){
              card.classList.remove('flash-dmg','flash-heal','shake');
              void card.offsetWidth;
              card.classList.add(delta < 0 ? 'flash-dmg' : 'flash-heal');
              if (delta < 0) card.classList.add('shake');
            });
            if (delta < 0 && navigator.vibrate) { try { navigator.vibrate(35); } catch(e){} }
          }
        }
        prevLps = cur;
        /* remote calc enabled only when connected */
        var rc2 = document.querySelector('.calc[data-ctx="remote"]');
        if (rc2) rc2.classList.toggle('disabled', !(role && netConnected));
        passLps = null;
      }

      /* ============ operations ============ */
      function pushOp(op){
        op.id = 'e' + (++entrySeq) + '_' + Date.now().toString(36);
        state.history.push(op);
      }
      function doOp(op){
        if (role === 'guest'){
          sendToHost({ t:'op', op:op });
          toast('送信済み');
          return;
        }
        pushOp(op);
        afterChange(op.p);
      }
      function doUndo(){
        if (role === 'guest'){ sendToHost({ t:'undo' }); return; }
        if (!state.history.length) return;
        var last = state.history.pop();
        afterChange(last.p);
      }
      function doDelete(id){
        if (role === 'guest'){ sendToHost({ t:'del', id:id }); return; }
        var idx = -1;
        state.history.forEach(function(e,i){ if (e.id === id) idx = i; });
        if (idx < 0) return;
        var p = state.history[idx].p;
        state.history.splice(idx, 1);
        afterChange(p);
      }
      function doReset(){
        if (role === 'guest'){ sendToHost({ t:'reset' }); toast('リセット送信済み'); return; }
        state.history = [];
        afterChange(null);
      }
      function doName(p, name){
        state.players[p].name = name;
        if (role === 'guest'){ sendToHost({ t:'name', p:p, name:name }); renderHistory(); return; }
        afterChange(null);
      }
      function afterChange(flashP){
        renderAll(typeof flashP === 'number' ? flashP : undefined);
        if (role === 'host') broadcastState();
      }

      /* ============ keypad wiring (event delegation) ============ */
      document.addEventListener('click', function(ev){
        var chip = ev.target.closest('[data-chip]');
        if (chip){
          var cbox = chip.closest('.calc'); var ctx = cbox.getAttribute('data-ctx');
          var v = amtNum(ctx) + parseInt(chip.getAttribute('data-chip'), 10);
          amounts[ctx] = String(Math.min(MAX_LP, v));
          renderCalc(ctx);
          return;
        }
        var chipSub = ev.target.closest('[data-chip-sub]');
        if (chipSub){
          var sbox = chipSub.closest('.calc'); var sctx = sbox.getAttribute('data-ctx');
          var subN = parseInt(chipSub.getAttribute('data-chip-sub'), 10);
          if (amtNum(sctx) > 0){
            /* a number is being entered: the − chip corrects it in
               place (clamped at empty), and the amount pulses so the
               tap visibly registers */
            var sv = amtNum(sctx) - subN;
            amounts[sctx] = sv > 0 ? String(sv) : '';
            renderCalc(sctx);
            bumpAmt(sbox);
          } else {
            /* nothing being entered: the − chip is correction-only,
               so it must NOT change LP on its own. Wiggle the amount
               row toward the number chips instead of ignoring the
               tap, so the press still gets a visible answer. */
            hintCalc(sbox);
          }
          return;
        }
        var clr = ev.target.closest('[data-k="clr"]');
        if (clr){
          var cbox2 = clr.closest('.calc'); var clctx = cbox2.getAttribute('data-ctx');
          amounts[clctx] = '';
          renderCalc(clctx);
          return;
        }
        var act = ev.target.closest('[data-act]');
        if (act){
          var abox = act.closest('.calc'); var actx = abox.getAttribute('data-ctx');
          var ap = ctxPlayer(actx);
          var kind = act.getAttribute('data-act');
          if (kind === 'half'){
            if (lps()[ap] > 0) doOp({ p:ap, kind:'half', amt:0 });
          } else {
            var n = amtNum(actx);
            if (n > 0){ doOp({ p:ap, kind:kind, amt:n }); amounts[actx] = ''; renderCalc(actx); }
            /* nothing entered yet: wiggle the amount row toward the
               chips instead of ignoring the tap (the buttons are
               dimmed via .off, never disabled, precisely so this tap
               still gets an answer) */
            else hintCalc(abox);
          }
          return;
        }
        var del = ev.target.closest('[data-del]');
        if (del){ doDelete(del.getAttribute('data-del')); return; }
      });

      /* ============ mode switching ============ */
      var views = { solo:document.getElementById('view-solo'), remote:document.getElementById('view-remote') };
      var histSec = document.getElementById('historySec');
      var sheetBack = document.getElementById('sheetBack');
      var sheetCloseBtn = document.getElementById('sheetCloseBtn');
      function setSheet(open){
        histSec.classList.toggle('sheet', open);
        sheetBack.hidden = !open;
        sheetCloseBtn.hidden = !open;
      }
      function switchMode(m){
        mode = m;
        document.body.setAttribute('data-mode', m);
        Object.keys(views).forEach(function(k){ views[k].hidden = k !== m; });
        document.querySelectorAll('[data-mode-btn]').forEach(function(b){
          b.setAttribute('aria-pressed', b.getAttribute('data-mode-btn') === m ? 'true' : 'false');
        });
        setSheet(false);
        renderAll();
      }
      document.querySelectorAll('[data-mode-btn]').forEach(function(b){
        b.addEventListener('click', function(){ switchMode(b.getAttribute('data-mode-btn')); });
      });
      document.getElementById('histBtnTop').addEventListener('click', function(){ setSheet(true); });
      sheetBack.addEventListener('click', function(){ setSheet(false); });
      sheetCloseBtn.addEventListener('click', function(){ setSheet(false); });

      /* sound on/off (in-memory only; default on) */
      var soundBtn = document.getElementById('soundBtn');
      soundBtn.addEventListener('click', function(){
        soundOn = !soundOn;
        soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
        document.getElementById('soundOnIcon').hidden = !soundOn;
        document.getElementById('soundOffIcon').hidden = soundOn;
        if (soundOn){ ensureAudio(); toast('効果音オン'); }
        else stopDrone();
      });

      /* undo / reset */
      document.getElementById('undoBtn').addEventListener('click', doUndo);
      var resetModal = document.getElementById('resetModal');
      document.getElementById('resetBtn').addEventListener('click', function(){ resetModal.hidden = false; });
      document.getElementById('resetCancel').addEventListener('click', function(){ resetModal.hidden = true; });
      resetModal.addEventListener('click', function(e){ if (e.target === resetModal) resetModal.hidden = true; });
      document.getElementById('resetOk').addEventListener('click', function(){ resetModal.hidden = true; doReset(); toast('新規デュエル開始！'); });

      /* toast */
      var toastTimer = null;
      function toast(msg){
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
      }

      /* ============ remote (PeerJS) ============ */
      var PREFIX = 'rdlc-v1-';
      var peer = null, role = null, netConnected = false;
      var nextSnapInstant = true;
      var hostConns = [], guestConn = null, myCode = null;
      var statusText = document.getElementById('statusText');
      var sdot = document.getElementById('sdot');

      /* ---- remote stage: lobby <-> battle ----
         Connected ('on') switches to the battle screen immediately.
         Losing the connection while in battle waits out a short grace
         window first, so a brief network hiccup doesn't flap the screen;
         LP and history are untouched either way, so rejoining the same
         room lands back on the battle screen with state intact. */
      var remoteStage = 'lobby';
      var battleExitTimer = null;
      function setRemoteStage(stage){
        remoteStage = stage;
        document.getElementById('remoteLobby').hidden = stage !== 'lobby';
        document.getElementById('remoteBattle').hidden = stage !== 'battle';
      }
      function syncRemoteStage(kind){
        var dot = document.getElementById('battleDot');
        if (dot) dot.className = 'sdot' + (kind ? ' ' + kind : '');
        if (kind === 'on'){
          if (battleExitTimer){ clearTimeout(battleExitTimer); battleExitTimer = null; }
          setRemoteStage('battle');
        } else if (remoteStage === 'battle' && !battleExitTimer){
          battleExitTimer = setTimeout(function(){
            battleExitTimer = null;
            setRemoteStage('lobby');
          }, 1600);
        }
      }
      function setStatus(kind, msg){
        statusText.textContent = msg;
        sdot.className = 'sdot' + (kind ? ' ' + kind : '');
        netConnected = (kind === 'on');
        syncRemoteStage(kind);
        renderAll();
      }
      function peerLibOk(){ return typeof window.Peer !== 'undefined'; }
      function genCode(){
        var chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
        var s = '';
        for (var i = 0; i < 6; i++) s += chars.charAt(Math.floor(Math.random() * chars.length));
        return s;
      }
      function basePageURL(){
        try {
          var u = new URL(location.href);
          if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
          u.search = '';
          u.hash = '';
          return u.toString();
        } catch(e){ return null; }
      }
      function inviteURL(code){
        if (!code) return null;
        var base = basePageURL();
        if (!base) return null;
        return base + '?join=' + encodeURIComponent(code);
      }
      function snapshot(){
        return { players: state.players, history: state.history.map(function(e){
          return { id:e.id, p:e.p, kind:e.kind, amt:e.amt };
        }) };
      }
      function applySnapshot(s){
        if (!s) return;
        state.players = s.players;
        state.history = s.history;
        state.history.forEach(function(e){ entrySeq++; });
        /* the first snapshot after connecting aligns the screens —
           show it instantly; later snapshots are LP changes and roll */
        if (nextSnapInstant){ forceInstant = true; nextSnapInstant = false; }
        afterChange(null);
        forceInstant = false;
      }
      function broadcastState(){
        var msg = { t:'state', s: snapshot() };
        hostConns.forEach(function(c){ try { if (c.open) c.send(msg); } catch(e){} });
      }
      function sendToHost(msg){
        if (guestConn && guestConn.open){ try { guestConn.send(msg); } catch(e){} }
        else toast('未接続');
      }
      function destroyPeer(){
        hostConns = []; guestConn = null; role = null; myCode = null;
        nextSnapInstant = true;
        if (peer){ try { peer.destroy(); } catch(e){} peer = null; }
      }
      function showRoomLive(isHost){
        document.getElementById('roomIdle').hidden = true;
        document.getElementById('roomLive').hidden = false;
        /* keep the calculator on one screen: collapse invite details once the room is live */
        document.getElementById('roomPanel').classList.add('collapsed');
        var toggleBtn = document.getElementById('roomToggleBtn');
        toggleBtn.textContent = '招待リンク・QRを表示';
        document.getElementById('roomCodeView').textContent = myCode || '------';
        var url = inviteURL(myCode);
        var hasLink = !!url;
        document.getElementById('roomLiveTitle').textContent = isHost ? (hasLink ? '招待リンク' : 'ルームコード') : 'ルーム参加中';
        document.getElementById('roomLiveDesc').textContent = isHost
          ? (hasLink ? '相手への送付用リンク' : 'ルームコード共有')
          : 'ホストルーム接続中';
        var linkInput = document.getElementById('inviteLinkInput');
        var qrBox = document.getElementById('qrBox');
        var linkRow = document.querySelector('#roomLive .linkrow');
        var qrWrap = document.querySelector('#roomLive .qrwrap');
        if (hasLink){
          if (toggleBtn) toggleBtn.style.display = '';
          if (linkRow) linkRow.style.display = '';
          if (qrWrap) qrWrap.style.display = '';
          linkInput.value = url;
          qrBox.innerHTML = '';
          if (typeof window.QRCode !== 'undefined'){
            try { new window.QRCode(qrBox, { text:url, width:132, height:132, colorDark:'#1a1206', colorLight:'#ffffff' }); } catch(e){}
          }
        } else {
          /* Non-http(s) context (e.g. Muse in-app / sandbox where
             location.href is about:blank or a custom scheme): there is
             no shareable URL, so never show a broken link or QR —
             the room code alone is the invite. On the user's own
             https hosting, hasLink is true and link + QR appear. */
          if (toggleBtn) toggleBtn.style.display = 'none';
          if (linkRow) linkRow.style.display = 'none';
          if (qrWrap) qrWrap.style.display = 'none';
          linkInput.value = '';
          qrBox.innerHTML = '';
        }
      }
      function showRoomIdle(){
        document.getElementById('roomIdle').hidden = false;
        document.getElementById('roomLive').hidden = true;
        document.getElementById('roomPanel').classList.remove('collapsed');
      }

      function createRoom(){
        if (!peerLibOk()){ setStatus('err', '接続ライブラリ読込失敗・再読込推奨'); return; }
        destroyPeer();
        myCode = genCode();
        role = 'host';
        setStatus('wait', 'ルーム作成中…');
        peer = new window.Peer(PREFIX + myCode);
        peer.on('open', function(){
          showRoomLive(true);
          setStatus('wait', 'ルーム「' + myCode + '」作成済み・参加待ち…');
        });
        peer.on('connection', function(conn){
          hostConns.push(conn);
          conn.on('open', function(){
            try { conn.send({ t:'state', s: snapshot() }); } catch(e){}
            setStatus('on', '接続中： 参加（' + hostConns.filter(function(c){return c.open;}).length + '台）');
          });
          conn.on('data', function(msg){ handleGuestMsg(msg); });
          conn.on('close', function(){
            hostConns = hostConns.filter(function(c){ return c !== conn; });
            if (hostConns.some(function(c){ return c.open; })) setStatus('on', '接続中');
            else setStatus('wait', '相手退出・参加待ち…');
          });
        });
        peer.on('error', function(err){
          if (err && err.type === 'unavailable-id'){ destroyPeer(); createRoom(); return; }
          setStatus('err', '接続エラー（' + (err && err.type ? err.type : 'unknown') + '）');
        });
        peer.on('disconnected', function(){ if (!bgSuspended){ try { peer.reconnect(); } catch(e){} } });
      }

      function handleGuestMsg(msg){
        if (!msg) return;
        if (msg.t === 'op'){ pushOp(msg.op); afterChange(msg.op.p); }
        else if (msg.t === 'undo'){ if (state.history.length){ var l = state.history.pop(); afterChange(l.p); } }
        else if (msg.t === 'del'){ doDeleteHost(msg.id); }
        else if (msg.t === 'reset'){ state.history = []; afterChange(null); }
        else if (msg.t === 'name'){ state.players[msg.p].name = msg.name; afterChange(null); }
      }
      function doDeleteHost(id){
        var idx = -1;
        state.history.forEach(function(e,i){ if (e.id === id) idx = i; });
        if (idx < 0) return;
        var p = state.history[idx].p;
        state.history.splice(idx, 1);
        afterChange(p);
      }

      function joinRoom(code){
        code = (code || '').trim().toUpperCase();
        if (!/^[A-Z0-9]{6}$/.test(code)){ toast('6文字コード必須'); return; }
        if (!peerLibOk()){ setStatus('err', '接続ライブラリ読込失敗・再読込推奨'); return; }
        destroyPeer();
        myCode = code;
        role = 'guest';
        setStatus('wait', 'ルーム「' + code + '」接続中…');
        peer = new window.Peer();
        peer.on('open', function(){
          guestConn = peer.connect(PREFIX + code, { reliable:true });
          guestConn.on('open', function(){
            showRoomLive(false);
            setStatus('on', '接続中： ルーム「' + code + '」参加中');
          });
          guestConn.on('data', function(msg){
            if (msg && msg.t === 'state') applySnapshot(msg.s);
          });
          guestConn.on('close', function(){
            destroyPeer();
            showRoomIdle();
            setStatus('err', 'ホスト接続切断');
          });
        });
        peer.on('error', function(err){
          if (err && err.type === 'peer-unavailable'){
            setStatus('err', 'ルーム未検出・コード要確認');
          } else {
            setStatus('err', '接続エラー（' + (err && err.type ? err.type : 'unknown') + '）');
          }
        });
      }

      document.getElementById('roomToggleBtn').addEventListener('click', function(){
        var panel = document.getElementById('roomPanel');
        var collapsed = panel.classList.toggle('collapsed');
        this.textContent = collapsed ? '招待リンク・QRを表示' : '招待リンク・QR非表示';
      });
      document.getElementById('createRoomBtn').addEventListener('click', createRoom);
      document.getElementById('joinRoomBtn').addEventListener('click', function(){
        joinRoom(document.getElementById('joinCodeInput').value);
      });
      function leaveRoom(){
        if (battleExitTimer){ clearTimeout(battleExitTimer); battleExitTimer = null; }
        destroyPeer();
        showRoomIdle();
        setRemoteStage('lobby');
        setStatus('', '未接続');
        toast('ルーム終了');
      }
      document.getElementById('leaveRoomBtn').addEventListener('click', leaveRoom);
      document.getElementById('battleLeaveBtn').addEventListener('click', leaveRoom);

      /* invite re-display from the battle screen */
      var inviteModal = document.getElementById('inviteModal');
      document.getElementById('inviteBtn').addEventListener('click', function(){
        document.getElementById('inviteCodeView').textContent = myCode || '------';
        var url = inviteURL(myCode);
        var hasLink = !!url;
        var inp2 = document.getElementById('inviteLinkInput2');
        var qb = document.getElementById('qrBox2');
        var mLinkRow = document.querySelector('#inviteModal .linkrow');
        var mQrWrap = document.querySelector('#inviteModal .qrwrap');
        if (hasLink){
          if (mLinkRow) mLinkRow.style.display = '';
          if (mQrWrap) mQrWrap.style.display = '';
          inp2.value = url;
          qb.innerHTML = '';
          if (typeof window.QRCode !== 'undefined'){
            try { new window.QRCode(qb, { text:url, width:132, height:132, colorDark:'#1a1206', colorLight:'#ffffff' }); } catch(e){}
          }
        } else {
          if (mLinkRow) mLinkRow.style.display = 'none';
          if (mQrWrap) mQrWrap.style.display = 'none';
          inp2.value = '';
          qb.innerHTML = '';
        }
        inviteModal.hidden = false;
      });
      document.getElementById('inviteCloseBtn').addEventListener('click', function(){ inviteModal.hidden = true; });
      inviteModal.addEventListener('click', function(e){ if (e.target === inviteModal) inviteModal.hidden = true; });
      document.getElementById('copyLinkBtn2').addEventListener('click', function(){
        var inp = document.getElementById('inviteLinkInput2');
        var url = inp.value;
        function done(){ toast('リンクコピー済み'); }
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(url).then(done, function(){ fallback(); });
        } else fallback();
        function fallback(){ inp.focus(); inp.select(); try { document.execCommand('copy'); done(); } catch(e){ toast('コピー失敗・長押しコピー'); } }
      });
      document.getElementById('copyLinkBtn').addEventListener('click', function(){
        var inp = document.getElementById('inviteLinkInput');
        var url = inp.value;
        function done(){ toast('リンクコピー済み'); }
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(url).then(done, function(){ fallback(); });
        } else fallback();
        function fallback(){ inp.focus(); inp.select(); try { document.execCommand('copy'); done(); } catch(e){ toast('コピー失敗・長押しコピー'); } }
      });

      /* auto-join from ?join=CODE */
      var joinParam = null;
      try { joinParam = new URLSearchParams(location.search).get('join'); } catch(e){}
      if (joinParam){
        switchMode('remote');
        document.getElementById('joinCodeInput').value = joinParam.toUpperCase();
        setTimeout(function(){ joinRoom(joinParam); }, 350);
      }

      renderAll();
    })();
    </script>
  </body>
</html>
